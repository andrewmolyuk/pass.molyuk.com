<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Relay</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" data-i18n="eyebrow">Одноразовая ссылка</div>
    <h1 data-i18n="title">Secret Relay</h1>
    <p class="sub" data-i18n="subtitle"></p>
    <div class="lang-switch">
      <button data-lang-switch="ru">RU</button>
      <button data-lang-switch="en">EN</button>
    </div>
  </header>

  <div class="panel">
    <label data-i18n="secretLabel">Секрет</label>
    <textarea id="secretInput" data-i18n-placeholder="secretPlaceholder"></textarea>

    <label data-i18n="ttlLabel">Срок жизни ссылки</label>
    <select id="ttlInput">
      <option value="300" data-i18n="ttl5m">5 минут</option>
      <option value="3600" selected data-i18n="ttl1h">1 час</option>
      <option value="86400" data-i18n="ttl24h">24 часа</option>
    </select>

    <button class="btn" id="createBtn" data-i18n="createBtn">Создать ссылку</button>

    <div class="field-row">
      <div class="out" id="linkOut" data-i18n="linkPlaceholder">Ссылка появится здесь</div>
      <button class="icon-btn hidden" id="copyLinkBtn" type="button" data-i18n-aria="copyLinkAria">
        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
        <svg class="icon-check hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </div>
    <div class="field-row">
      <div class="pin-out hidden" id="pinOut"></div>
      <button class="icon-btn hidden" id="copyPinBtn" type="button" data-i18n-aria="copyPinAria">
        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
        <svg class="icon-check hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </div>
    <div class="pin-hint hidden" id="pinHint" data-i18n="pinHint"></div>
    <div class="note" id="createNote"></div>
  </div>

  <div class="footer-note" data-i18n-html="footerNote"></div>
</div>
<script type="module" src="/create.js"></script>
</body>
</html>
